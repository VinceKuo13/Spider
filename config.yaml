# ============================================================
# 爬虫通用配置文件
# ============================================================
# 使用方式：
# 1. 想爬哪个省，就在终端运行对应脚本，例如：python tianjin.py
# 2. 关键词、开始日期、结束日期只在这里修改。
# 3. 其他参数，比如公告类型、输出目录、请求间隔等，保留在各省 .py 文件中。

# 关键词。可以写 1 个，也可以写多个。
keywords:
  - 营商环境
  # - 政务服务
  # - 数字政府

# 开始日期，格式必须是 YYYY-MM-DD。
start_date: "2025-01-01"

# 结束日期，格式必须是 YYYY-MM-DD。
# 留空表示运行当天。
# end_date: "2026-03-01"
end_date: ""
